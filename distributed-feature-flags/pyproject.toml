[tool.poetry]
name = "distributed-feature-flags"
version = "0.1.0"
description = "A production-grade Distributed Feature Flag Platform"
authors = ["AI Coding Assistant <antigravity@google.com>"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.111.0"
uvicorn = "^0.30.1"
pydantic = "^2.7.4"
pydantic-settings = "^2.3.3"
sqlalchemy = "^2.0.31"
alembic = "^1.13.1"
psycopg2-binary = "^2.9.9"
asyncpg = "^0.29.0"
structlog = "^24.2.0"
prometheus-client = "^0.20.0"
pyjwt = "^2.8.0"
bcrypt = "^4.1.3"
email-validator = "^2.1.0"
redis = "^5.0.0"
aiokafka = "^0.10.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.2"
black = "^24.4.2"
isort = "^5.13.2"
mypy = "^1.10.0"
ruff = "^0.4.7"
pre-commit = "^3.7.1"
aiosqlite = "^0.20.0"

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = [
    ".git",
    ".mypy_cache",
    ".ruff_cache",
    ".venv",
    "venv",
    "__pycache__",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (import sorting)
    "UP",  # pyupgrade (modern Python recommendations)
]
ignore = ["E501", "UP046", "UP042"]

[tool.ruff.lint.isort]
combine-as-imports = true
force-wrap-aliases = true

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
